# SPDX-License-Identifier: GPL-3.0-or-later
#
# Dawn is GPLv3 (Slint is used under GPLv3; see CLAUDE.md and SPEC.md
# "Decisions at a glance"). Every dependency's licence must be compatible
# with distributing the whole under GPLv3.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Unlicense",
    "GPL-3.0-or-later",
    # Added with Slint (M2): its own dual-licensing offers GPL-3.0-only
    # as one satisfying branch, and it pulls in a much larger tree
    # (winit, resvg, arboard, ...) than plan/backend needed alone —
    # every one of these is a standard permissive OSI license.
    "GPL-3.0-only",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The plan/backend/frontend workspace members reference each other by path
# only (they're never published), which this lint would otherwise flag.
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# ttf-parser (deep under Slint's winit backend, via sctk-adwaita's
# Wayland client-side-decoration font rendering) is flagged unmaintained
# with no safe upgrade available yet. Not a vulnerability — tracked, not
# blocking, until winit's dependency tree moves off it.
ignore = ["RUSTSEC-2026-0192"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
