[package]
name = "frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Dawn: the Slint GUI. Reads config and branding, asks the backend for disks, builds the plan, shows progress."

[lib]
name = "frontend"
path = "src/lib.rs"

[[bin]]
name = "dawn"
path = "src/main.rs"

[dependencies]
plan = { path = "../plan" }
slint = "1.18"
serde_json = "1"
toml = "0.8"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
# Pinned exactly per its own README: this crate doesn't follow semver.
i-slint-backend-testing = "=1.18.1"
