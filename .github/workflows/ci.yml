name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request supersedes the run in flight,
# whose e2e jobs would otherwise keep runners busy on stale code.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # cargo fmt, clippy, unit/snapshot tests, cargo-deny, and the M0 dry-run
  # check. Every commit, per SPEC.md's Testing table.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Slint's Linux build dependencies (M2 pulls in winit/femtovg)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libudev-dev libinput-dev \
            libgbm-dev libfontconfig-dev libseat-dev libsystemd-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo install cargo-deny --locked
      - run: cargo deny check
      - run: cargo run -p backend -- --dry-run tests/plans/erase-online.json

  # SPEC.md's "Loop-device integration" row: partition, format, mount and
  # pacstrap really work, against a sparse file on a loop device. Needs
  # root for losetup/mkfs/mount, so it runs inside a disposable
  # container, never on a developer's own machine (CLAUDE.md).
  loop-device-integration:
    runs-on: ubuntu-latest
    needs: checks
    # Well above a normal run; a hang should fail, not hold a runner for
    # GitHub's six-hour default.
    timeout-minutes: 30
    container:
      image: archlinux:base-devel
      # Docker's own /dev is a snapshot taken when the container starts,
      # so the loop device's partitions (created later, by dawn-backend's
      # sfdisk) would never appear in it. The host's /dev is the kernel's
      # devtmpfs, where they do.
      options: --privileged -v /dev:/dev
    steps:
      - uses: actions/checkout@v5
      - name: Install build and install tooling
        run: |
          pacman -Sy --noconfirm rust arch-install-scripts btrfs-progs \
            dosfstools parted util-linux jq python
      - name: Loop-device install (online, pacstrap)
        run: |
          set -euo pipefail
          MIRROR_DIR=$(mktemp -d)
          trap 'kill "$(cat "$MIRROR_DIR/http-server.pid" 2>/dev/null)" 2>/dev/null || true' EXIT
          tests/e2e/setup-local-mirror.sh "$MIRROR_DIR"
          tests/e2e/loop-device-install.sh online tests/plans/erase-online.json \
            "$MIRROR_DIR"

  # M3's Done-when check: "Dawn installs a VM end to end from the GUI,
  # online and offline; a forced failure shows the error screen with
  # log", and M4's: "In OVMF Setup Mode, the installed system boots with
  # Secure Boot enforcing". Each install is followed by logging in on
  # the installed system's serial console as the new user. Needs
  # /dev/kvm and OVMF (CLAUDE.md: check before any VM step); GitHub's
  # ubuntu-latest runners provide KVM, passed into the container below.
  #
  # mkarchiso is Arch-only tooling (no Ubuntu package), so this runs in
  # the same archlinux container as loop-device-integration rather than
  # directly on the Ubuntu host. --privileged (needed for mkarchiso's own
  # loop-device use) also covers access to the host's /dev/kvm.
  qemu-end-to-end:
    runs-on: ubuntu-latest
    needs: checks
    # One ISO build plus four installs and boots, each with its own
    # timeout in qemu-run.sh, fit inside this with room to spare.
    timeout-minutes: 150
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - name: Check for /dev/kvm
        run: test -e /dev/kvm || (echo "no /dev/kvm on this runner" >&2; exit 1)
      - name: Install build, archiso and QEMU tooling
        # fontconfig: the only system library the GUI driver links.
        run: |
          pacman -Sy --noconfirm rust fontconfig archiso qemu-system-x86 \
            qemu-img edk2-ovmf jq arch-install-scripts btrfs-progs \
            dosfstools util-linux python
      - uses: Swatinem/rust-cache@v2
      - name: Build the test ISO (dawn-backend, gui_driver, local mirror, stand-in packages)
        id: prepare
        run: tests/e2e/run-e2e.sh prepare
      # Each scenario runs even if an earlier one failed, so one run shows
      # every failure.
      - name: Online install through the GUI, then boot to login
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: tests/e2e/run-e2e.sh online
      - name: Offline install through the GUI, then boot to login
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: tests/e2e/run-e2e.sh offline
      - name: Forced pacstrap failure, error screen, offline install from RAM, then boot to login
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: tests/e2e/run-e2e.sh fail-then-offline
      - name: Secure Boot set up in OVMF Setup Mode, then boot with it enforcing
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
        run: tests/e2e/run-e2e.sh secure-boot
      - name: Upload the serial console logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-serial-logs
          path: /tmp/dawn-e2e/*.log
          if-no-files-found: ignore
