[package]
name = "backend"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "dawn-backend: probes disks, validates a plan, runs the install pipeline, streams events. --dry-run prints the command list instead of running it."

[[bin]]
name = "dawn-backend"
path = "src/main.rs"

[dependencies]
plan = { path = "../plan" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
